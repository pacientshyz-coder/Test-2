name: PC Virtual Windows - KZ

on:
  workflow_dispatch:

jobs:
  windows-pc:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configurar Windows
        shell: powershell
        run: |
          Write-Host "Configurando PC virtual..."

          # Habilita RDP
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1

          $Username = "RunnerAdmin"
          $Password = 'X9#mK$7!vL2@zP9q'

          # Define a senha do usuário
          $securePassword = ConvertTo-SecureString $Password -AsPlainText -Force
          Set-LocalUser -Name $Username -Password $securePassword
          Set-LocalUser -Name $Username -PasswordNeverExpires $true

          Write-Host "Ambiente RDP configurado e senha definida com sucesso para o usuário $Username."

      - name: Instalar Tailscale
        shell: powershell
        run: |
          Write-Host "Baixando Tailscale..."
          
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          
          Write-Host "Instalando Tailscale..."
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          
          # Aguarda o serviço iniciar
          Start-Sleep -Seconds 10
          
          Write-Host "Tailscale instalado."

      - name: Conectar Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          
          if (!(Test-Path $tailscale)) {
              Write-Error "Tailscale não encontrado em $tailscale"
              exit 1
          }
          
          Write-Host "Conectando ao Tailscale..."
          & $tailscale up --auth-key="$env:TS_AUTHKEY" --hostname="KZ-Virtual-PC" --accept-routes --unattended
          
          Start-Sleep -Seconds 15
          
          Write-Host ""
          Write-Host "===== IP TAILSCALE ====="
          & $tailscale ip -4

      - name: Instalar programas
        shell: powershell
        run: |
          Write-Host "Instalando programas..."

          # Usa apenas a fonte "winget" para evitar erro do msstore
          winget install --id 7zip.7zip `
            --exact `
            --source winget `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          # Se já estiver instalado e não houver upgrade, trata como sucesso
          if ($LASTEXITCODE -eq -1978335189 -or $LASTEXITCODE -eq 1) {
              Write-Host "7-Zip já está instalado (ou sem upgrade disponível). Continuando..."
              $global:LASTEXITCODE = 0
          }

          Write-Host "Programas instalados."

      - name: Mostrar IP para Windows App
        shell: powershell
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          
          Write-Host ""
          Write-Host "======================================"
          Write-Host "      DADOS PARA WINDOWS APP"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "IP Tailscale:"
          & $tailscale ip -4
          Write-Host ""
          Write-Host "Usuário: RunnerAdmin"
          Write-Host "Senha: X9#mK`$7!vL2@zP9q"
          Write-Host "======================================"

      - name: Manter PC virtual ligado
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "       PC VIRTUAL ESTÁ ONLINE"
          Write-Host "======================================"
          Write-Host ""
          
          while ($true) {
              $time = Get-Date -Format "HH:mm:ss"
              Write-Host "PC online - $time"
              Start-Sleep -Seconds 60
          }
